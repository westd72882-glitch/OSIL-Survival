# ==================== КОНФИГУРАЦИЯ СЕРВЕРА OSIL SURVIVAL ====================
# Формат: одна настройка на строку, "ключ = значение" или "ключ значение".
# Комментарии — # или //. Любой параметр можно переопределить при запуске:
#   ./osil_server +world.seed 12345 --server.maxplayers=50

# ---------------- Сервер ----------------
server.hostname     = "OSIL Survival — тестовый сервер"
server.description  = "Хардкорное выживание: рейды, кланы, вайп по воскресеньям"
server.port         = 28015
server.maxplayers   = 100
# Шагов симуляции в секунду. 30 — рабочее значение для 100 игроков; выше растёт
# нагрузка на процессор, ниже — стрельба ощущается «ватной».
server.tickrate     = 30
server.saveinterval = 300
server.savepath     = "world.db"
server.loglevel     = info
# server.logfile    = "logs/server.log"

# ---------------- Мир ----------------
# Сид: число или слово (слово хешируется). 0 — выбрать случайно и напечатать в лог.
world.seed          = osil
world.size          = 1000
world.gridstep      = 2
world.maxheight     = 120
world.waterlevel    = 18
world.rivers        = true
world.resourcedensity = 1.0
# Локации (военные лагеря, аэродром, радтауны) отключены до 5-го этапа: пока внутри
# них ничего нет, точки интереса только сбивают с толку.
world.monuments     = 0
# Полные игровые сутки за столько РЕАЛЬНЫХ минут (по ТЗ — 60).
world.daylength     = 60
world.starttime     = 8

# ---------------- Рейд-часы (этап 4) ----------------
# Когда включено, взрывчатка работает только в заданное окно времени суток.
raid.enabled        = false
raid.starthour      = 18
raid.endhour        = 6
